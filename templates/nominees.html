<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nomination Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Nomination Form</h1>

        <div class="progress mb-4">
            <div class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
        </div>

        <form action="/" method="POST" enctype="multipart/form-data" id="nominationForm">
            {% for position in positions %}
            <div class="card mb-4">
                <div class="card-header">
                    <h5>{{ position.title }}</h5>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label for="category1" class="form-label">Nominee Name</label>
                        <input type="text" class="form-control" id="category1" required placeholder="Enter nominee's full name">
                    </div>
                </div>
            </div>
            {% endfor %}

            <!-- Repeat the card structure for the remaining 14 categories -->

            <button type="submit" class="btn btn-primary">Submit Nominations</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
            $(document).ready(function(){
        $("input[type='text']").each(function() {
            $(this).autocomplete({
                source: function(request, response) {
                    $.ajax({
                        url: "{{ url_for('autocomplete') }}",
                        dataType: "json",
                        data: {
                            q: request.term
                        },
                        success: function(data) {
                            response($.map(data, function(item) {
                                return {
                                    label: item.label,
                                    value: item.label
                                };
                            }));
                        }
                    });
                },
                minLength: 2
            });
        });
    });
    </script>
</body>
</html>
